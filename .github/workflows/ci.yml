name: Notebook checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check cancer_var.ipynb
      - run: python -c "import nbformat; nbformat.validate(nbformat.read('cancer_var.ipynb', as_version=4))"
      - run: mkdir -p artifacts
      - run: jupyter nbconvert --to notebook --execute cancer_var.ipynb --output executed.ipynb --output-dir artifacts --ExecutePreprocessor.timeout=600
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-report-${{ matrix.python-version }}
          path: |
            artifacts/executed.ipynb
            artifacts/*.json
